name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 本物の Contentful の型は Management API から生成するのでトークンが要る。
  # CI には Secrets を置かず、コードが読むフィールドだけを書いたスタブ
  # (.github/stubs/contentful.d.ts) を生成先へ複写して lint と型検査を通す。
  # ビルドは Contentful からデータを取るので CI では走らせない。
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the Contentful type stub
        run: |
          mkdir -p @types/generated
          cp .github/stubs/contentful.d.ts @types/generated/contentful.d.ts
      - run: npm run lint
      - run: npm run type-check
